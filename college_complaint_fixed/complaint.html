<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Submit Complaint</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><h2>📝 Submit Complaint</h2><nav class="nav"><a href="student_dashboard.html">Dashboard</a><a href="student_complaints.html">My Complaints</a></nav></header>
<main class="container"><section class="panel"><div class="page-title"><h1>Submit New Complaint</h1><p>Fill the details clearly. Your complaint will be saved with Pending status.</p></div><form id="complaintForm"><div class="form-row"><div class="form-group"><label>Register Number</label><input id="regno" readonly></div><div class="form-group"><label>Student Name</label><input id="studentName" readonly></div></div><div class="form-row"><div class="form-group"><label>Department</label><input id="studentDept" readonly></div><div class="form-group"><label for="complaintType">Complaint Type</label><select id="complaintType" required><option value="">Choose complaint type</option><option>Student Complaint</option><option>Staff Complaint</option></select></div></div><div class="form-row"><div class="form-group"><label for="complaintCategory">Complaint Category</label><select id="complaintCategory" required><option value="">Select Category</option><option>Staff Behaviour</option><option>Lab Issue</option><option>Classroom Issue</option><option>Library Issue</option><option>Hostel Issue</option><option>Bus Issue</option><option>Canteen Issue</option><option>Internet Problem</option><option>Ragging</option><option>Others</option></select></div><div class="form-group"><label for="assignedStaff">Select Staff (Optional)</label><select id="assignedStaff"><option value="">Choose Staff</option><option>Mr. Kumar</option><option>Mrs. Priya</option><option>Dr. Arun</option><option>Other</option></select></div></div><div class="form-group"><label for="complaintDescription">Complaint Description</label><textarea id="complaintDescription" placeholder="Explain your complaint clearly..." required></textarea></div><div class="form-row"><div class="form-group"><label for="complaintPriority">Priority</label><select id="complaintPriority"><option>Low</option><option selected>Medium</option><option>High</option></select></div><div class="form-group"><label for="evidence">Upload Evidence (Optional)</label><input id="evidence" type="file" accept="image/*,.pdf,.doc,.docx"></div></div><div class="checkbox-row"><input type="checkbox" id="anonymous"><label for="anonymous">Submit as Anonymous</label></div><div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" type="submit">Submit Complaint</button><a class="btn btn-light" href="student_dashboard.html">Back to Dashboard</a></div></form></section></main>
<script src="app.js"></script><script>
const student=CCMS.requireStudent();if(student){document.getElementById('regno').value=student.regno;document.getElementById('studentName').value=student.name;document.getElementById('studentDept').value=student.department;}
document.getElementById('complaintForm').addEventListener('submit',function(e){e.preventDefault();if(!student)return;const file=document.getElementById('evidence').files[0];const complaint={id:CCMS.complaintId(),regno:student.regno,studentName:student.name,department:student.department,type:document.getElementById('complaintType').value,category:document.getElementById('complaintCategory').value,staff:document.getElementById('assignedStaff').value||'N/A',description:document.getElementById('complaintDescription').value.trim(),priority:document.getElementById('complaintPriority').value,evidenceName:file?file.name:'',anonymous:document.getElementById('anonymous').checked,status:'Pending',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};const complaints=CCMS.getComplaints();complaints.push(complaint);CCMS.saveComplaints(complaints);alert(`Complaint submitted successfully!\nComplaint ID: ${complaint.id}`);location.href='student_complaints.html';});
</script></body></html>
