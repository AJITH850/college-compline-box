<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Student Profile</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><h2>👤 Student Profile</h2><div class="nav"><a href="student_dashboard.html">Dashboard</a><button class="btn btn-danger" onclick="CCMS.studentLogout()">Logout</button></div></header><main class="container"><section class="panel"><div class="page-title"><h1>Welcome, <span id="studentName"></span></h1><p>Review your student account details.</p></div><div class="grid"><div class="card"><h3>Register Number</h3><p id="studentRegno"></p></div><div class="card"><h3>Department</h3><p id="studentDept"></p></div><div class="card"><h3>Email</h3><p id="studentEmail"></p></div><div class="card"><h3>Account Type</h3><p>Student User</p></div></div><div style="margin-top:22px;display:flex;gap:12px;flex-wrap:wrap"><a class="btn" href="student_complaints.html">My Complaints</a><a class="btn btn-light" href="complaint.html">Submit Complaint</a></div></section></main>
<script src="app.js"></script><script>const s=CCMS.requireStudent();if(s){document.getElementById('studentName').textContent=s.name;document.getElementById('studentRegno').textContent=s.regno;document.getElementById('studentDept').textContent=s.department||'Not specified';document.getElementById('studentEmail').textContent=s.email||`${s.regno.toLowerCase()}@college.edu`;}</script></body></html>
