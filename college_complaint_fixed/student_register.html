<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Student Registration</title><link rel="stylesheet" href="styles.css"></head>
<body class="login-wrap"><section class="login-box"><h2>📝 Student Registration</h2><form id="registerForm">
<div class="form-group"><label for="regno">Register Number</label><input id="regno" required maxlength="30" placeholder="e.g. 22CS002"></div>
<div class="form-group"><label for="name">Student Name</label><input id="name" required maxlength="80"></div>
<div class="form-group"><label for="department">Department</label><select id="department" required><option value="">Select Department</option><option>Computer Science</option><option>Information Technology</option><option>Mechanical</option><option>Electrical</option><option>Civil</option><option>Electronics</option></select></div>
<div class="form-group"><label for="email">Email</label><input type="email" id="email" required></div>
<div class="form-group"><label for="password">Password</label><input type="password" id="password" minlength="4" required></div>
<button class="btn" style="width:100%" type="submit">Create Account</button><p id="message" class="message"></p></form>
<div class="links"><a href="student_login.html">Already registered? Login</a> · <a href="index.html">Home</a></div></section><script src="app.js"></script><script>
if(CCMS.getStudentSession()) location.href='student_dashboard.html';
document.getElementById('registerForm').addEventListener('submit',e=>{e.preventDefault();const regno=document.getElementById('regno').value.trim().toUpperCase();const students=CCMS.getStudents();const msg=document.getElementById('message');if(students.some(s=>s.regno.toUpperCase()===regno)){msg.className='message error';msg.textContent='This register number is already registered.';return;}students.push({regno,name:document.getElementById('name').value.trim(),department:document.getElementById('department').value,email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});CCMS.saveStudents(students);msg.className='message success';msg.textContent='Registration successful. Redirecting to login...';setTimeout(()=>location.href='student_login.html',500);});
</script></body></html>
