<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Login</title><link rel="stylesheet" href="styles.css"></head><body class="login-wrap"><section class="login-box"><h2>🛠 Admin Login</h2><form id="adminLoginForm"><div class="form-group"><label for="username">Username</label><input id="username" autocomplete="username" required></div><div class="form-group"><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required></div><button class="btn" style="width:100%" type="submit">Login</button><p id="errorMessage" class="message error"></p></form><div class="links"><a href="index.html">Back to Home</a> · <a href="student_login.html">Student Login</a></div></section><script src="app.js"></script><script>
if(CCMS.getAdminSession()) location.href='admin_dashboard.html';document.getElementById('adminLoginForm').addEventListener('submit',e=>{e.preventDefault();const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;if(u==='admin'&&p==='1234'){sessionStorage.setItem('adminUser',JSON.stringify({username:'admin'}));location.href='admin_dashboard.html';}else document.getElementById('errorMessage').textContent='Invalid username or password.';});
</script></body></html>
