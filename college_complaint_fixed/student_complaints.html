<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Complaints</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><h2>📋 My Complaints</h2><div class="nav"><a href="student_dashboard.html">Dashboard</a><button class="btn btn-danger" onclick="CCMS.studentLogout()">Logout</button></div></header>
<main class="container"><div class="page-title"><h1>Your complaints and status</h1><p>Track progress and review previous submissions.</p></div><div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px"><a class="btn" href="complaint.html">Submit New Complaint</a><button class="btn btn-light" onclick="renderComplaints()">Refresh</button></div><div class="table-wrap"><table id="complaintsTable"><thead><tr><th>ID</th><th>Type</th><th>Category</th><th>Department</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" style="display:none">No complaints submitted yet.</div></div></main>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><h2>Complaint Details</h2><div id="details"></div><button class="btn btn-light" onclick="closeModal()">Close</button></div></div>
<script src="app.js"></script><script>
const student=CCMS.requireStudent();function renderComplaints(){if(!student)return;const list=CCMS.getComplaints().filter(c=>c.regno===student.regno).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));const tbody=document.getElementById('rows'),empty=document.getElementById('empty'),table=document.getElementById('complaintsTable');tbody.innerHTML='';if(!list.length){table.style.display='none';empty.style.display='block';return;}table.style.display='table';empty.style.display='none';list.forEach(c=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${CCMS.escapeHtml(c.id)}</td><td>${CCMS.escapeHtml(c.type)}</td><td>${CCMS.escapeHtml(c.category)}</td><td>${CCMS.escapeHtml(c.department)}</td><td>${CCMS.statusBadge(c.status)}</td><td>${CCMS.escapeHtml(CCMS.formatDate(c.createdAt))}</td><td><button class="btn btn-sm" onclick="viewDetails('${CCMS.escapeHtml(c.id)}')">View</button></td>`;tbody.appendChild(tr);});}
function viewDetails(id){const c=CCMS.getComplaints().find(x=>x.id===id&&x.regno===student.regno);if(!c)return;document.getElementById('details').innerHTML=`<div class="detail-list"><div><strong>ID</strong>${CCMS.escapeHtml(c.id)}</div><div><strong>Status</strong>${CCMS.statusBadge(c.status)}</div><div><strong>Student</strong>${c.anonymous?'Anonymous':CCMS.escapeHtml(c.studentName)}</div><div><strong>Department</strong>${CCMS.escapeHtml(c.department)}</div><div><strong>Type</strong>${CCMS.escapeHtml(c.type)}</div><div><strong>Category</strong>${CCMS.escapeHtml(c.category)}</div><div><strong>Staff</strong>${CCMS.escapeHtml(c.staff||'N/A')}</div><div><strong>Priority</strong>${CCMS.escapeHtml(c.priority||'Medium')}</div><div><strong>Evidence</strong>${CCMS.escapeHtml(c.evidenceName||'None')}</div><div><strong>Submitted</strong>${CCMS.escapeHtml(CCMS.formatDate(c.createdAt))}</div></div><p style="margin:15px 0;line-height:1.6"><strong>Description</strong><br>${CCMS.escapeHtml(c.description)}</p>`;document.getElementById('modalBackdrop').style.display='flex';}
function closeModal(){document.getElementById('modalBackdrop').style.display='none'}document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal();});renderComplaints();
</script></body></html>
